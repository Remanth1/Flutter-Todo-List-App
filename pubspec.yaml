name: todo_list_app
description: Production-grade Todo app UI with Riverpod, Hive, and go_router.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  hive_flutter: ^1.1.0
  go_router: ^13.0.0
  fl_chart: ^1.2.0
  google_fonts: ^8.0.2
  intl: ^0.20.2
  uuid: ^4.3.3
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  lottie: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"
