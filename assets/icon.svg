<svg viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradient for modern look -->
  <defs>
    <linearGradient id="taskGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B4DB8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E88E5;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="96" cy="96" r="96" fill="url(#taskGradient)" filter="url(#shadow)"/>
  
  <!-- Checkmark path -->
  <g transform="translate(96, 96)">
    <!-- Left stroke of checkmark -->
    <path d="M -25 0 L -10 15" stroke="white" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right stroke of checkmark -->
    <path d="M -10 15 L 30 -25" stroke="white" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
